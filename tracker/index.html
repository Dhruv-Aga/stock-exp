<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script src="../src/shell/base-path-detect.js"></script>
    <script>
      var target = (window.__BASE_PATH__ || "") + "/portfolio/";
      document.write('<meta http-equiv="refresh" content="0;url=' + target + '" />');
      location.replace(target);
    </script>
  </head>
  <body>
    <p><a id="portfolio-link" href="/portfolio/">Moved to Portfolio</a></p>
    <script>
      document.getElementById("portfolio-link").href = target;
    </script>
  </body>
</html>
