<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask — Bharat Scout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="./assistant.css" />
    <link rel="stylesheet" href="../src/shell/shell.css" />
    <script src="../src/shell/base-path-detect.js"></script>
  </head>
  <body>
    <div class="container">
      <div id="shell-nav"></div>
      <div id="shell-status"></div>

      <header class="header">
        <div class="brand">
          <div class="logo" aria-hidden="true">🤖</div>
          <div>
            <a class="header-back" href="/">← Trading Home</a>
            <h1>Ask</h1>
            <p class="sub" id="agentStatus">Connecting to agent…</p>
          </div>
        </div>
      </header>

      <main class="assistant-layout">
        <section class="card assistant-chat" aria-label="Chat">
          <div class="assistant-prompts" id="quickPrompts">
            <button class="prompt-chip" type="button" data-prompt="How is my portfolio performing?">
              How is my portfolio?
            </button>
            <button class="prompt-chip" type="button" data-prompt="Show today's strategy signals for all configured tickers.">
              Today's signals
            </button>
            <button class="prompt-chip" type="button" data-prompt="Compare my paper portfolio performance vs Rs 1 lakh starting capital.">
              Compare vs Rs 1 lakh
            </button>
            <button class="prompt-chip" type="button" data-prompt="List any pending live trade proposals.">
              Pending trades
            </button>
          </div>
          <div class="chat-messages" id="chatMessages"></div>
          <form class="chat-form" id="chatForm">
            <div class="chat-history-picker">
              <button class="session-history-toggle" id="sessionHistoryToggle" type="button" aria-label="Open session history">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 0 1 7.6 14.4l1.4 1.4 1.4-1.4-1.4-1.4a9 9 0 1 1-8.9-13.6Zm0 2a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm-1 3h2v4.3l3.2 2.2-1 1.7-4.2-2.8V8Z"/></svg>
              </button>
              <div class="session-dropdown" id="sessionDropdown" role="menu" aria-label="Session history"></div>
            </div>
            <textarea
              id="chatInput"
              rows="2"
              placeholder="Ask about your portfolio, run a strategy, or benchmark performance…"
              required
            ></textarea>
            <button class="btn-primary" type="submit" id="sendBtn">Send</button>
          </form>
        </section>

        <aside class="card assistant-sidebar">
          <div class="session-header">
            <h2>Sessions</h2>
            <button class="btn-secondary" type="button" id="newChatBtn">New chat</button>
          </div>
          <div id="sessionList" class="session-list" aria-live="polite"></div>

          <h2>Capabilities</h2>
          <p class="sub">The assistant picks tools automatically based on your question.</p>
          <div id="capabilityGroups"></div>
          <div class="assistant-hint">
            <strong>Live trades:</strong> assistant can propose only — you review at
            <a href="/approvals/">Review</a><br />
            <strong>Start:</strong> <code>./scripts/dev.sh start</code>
          </div>
        </aside>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script type="module">
      import { initShell } from "../src/shell/init.js";
      initShell({ page: "assistant" });
    </script>
    <script type="module" src="./assistant.js"></script>
  </body>
</html>
