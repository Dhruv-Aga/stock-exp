name: Deploy static frontend to GitHub Pages

# Static site only. Paper trading must not run in GitHub Actions — refresh
# locally with `./scripts/dev.sh paper` (or `./scripts/dev.ps1 paper`) or a
# local cron job, then commit the generated snapshot if you want it on Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static artifact
        run: python3 scripts/build_pages_dist.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
