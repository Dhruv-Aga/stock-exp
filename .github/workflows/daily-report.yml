name: Daily paper trading report

on:
  schedule:
    # 16:00 IST -> 10:30 UTC, weekdays only
    - cron: '30 10 * * 1-5'
  workflow_dispatch: {}

# Ensure the workflow has permission to push and manage Pages. If your org restricts
# GITHUB_TOKEN write access this may still fail — in that case create a PAT and
# store it in GH_PAGES_DEPLOY_TOKEN secret, then uncomment personal_token below.
permissions:
  contents: write
  pages: write
  id-token: write


jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GH_PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily report & generate dashboard
        run: |
          python scripts/generate_dashboard.py --refresh
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Email daily report
        if: ${{ secrets.SMTP_HOST != '' && secrets.SMTP_USER != '' && secrets.SMTP_PASSWORD != '' && secrets.EMAIL_TO != '' }}
        run: |
          python run_daily_report.py --email --no-refresh
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit paper state to main (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" || true
          git add paper/ data/paper_state.json data/trades.json || true
          git commit -m "Auto: update paper portfolio snapshot [ci skip]" || echo "No changes to commit"
          git push origin HEAD:main || echo "Push to main failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAGES_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Pages (for docs deploy)
        uses: actions/configure-pages@v5

      - name: Upload pages artifact (full static site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        # No inputs: it deploys the artifact uploaded by upload-pages-artifact
