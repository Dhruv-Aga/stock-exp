name: Daily paper trading report

on:
  schedule:
    # 16:00 IST -> 10:30 UTC, weekdays only
    - cron: '30 10 * * 1-5'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily report & generate dashboard
        run: |
          python scripts/generate_dashboard.py --refresh

      - name: Commit and push docs and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs || true
          git add data/paper_state.json || true
          git commit -m "Auto: daily paper report and dashboard" || echo "No changes to commit"
          git push || echo "Push failed"
        env:
          # GITHUB_TOKEN is automatically provided to workflows
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
